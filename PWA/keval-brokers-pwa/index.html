<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'" />
  <meta name="theme-color" content="#17233a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Keval Brokers" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Keval Brokers</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="pwa.css" />
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="logo">
        <span class="mark">K</span>
        <div><strong>Keval Brokers</strong><small>Upleta, Kathiyawad</small></div>
      </div>
      <nav id="nav">
        <button data-tab="today"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Today</button>
        <button data-tab="parties"><svg class="ico" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Parties</button>
        <button data-tab="bills"><svg class="ico" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>Bills</button>
        <button data-tab="settings"><svg class="ico" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Settings</button>
      </nav>
      <p class="side-foot">Saved on this phone.<br />Sync with the computer in Settings.</p>
    </aside>
    <main id="view"></main>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="logic.js"></script>
  <script src="pwa-api.js"></script>
  <script src="app.js"></script>
</body>
</html>
